[plugins]
enabled = [ "raycursive/niri-displays" ]

[shell]
corner_radius_scale = 0.0
lang = "en"
panel_anchor_bar = "Top_Panel"

    [shell.launcher]
    compact = true
    layout = "simple"
    show_icons = false
    width = 690

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "top_right"

[theme]
builtin = "Kanagawa"
community_palette = "Rose Pine Moon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "niri" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/cywil5115/Obrazy/pexels-grisentig-4215110.jpg"

    [wallpaper.last]
    path = "/home/cywil5115/Obrazy/pexels-grisentig-4215110.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/cywil5115/Obrazy/pexels-grisentig-4215110.jpg"

[weather]
enabled = false

[widget.bar]
show_resolution = false
type = "raycursive/niri-displays:bar"

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%D %H:%M}"
scale = 1.05

[widget.launcher]
custom_image = "/usr/share/icons/aerynos-logo-dark.png"
scale = 1.2

[widget.media]
album_art_only = true
art_size = 26
hide_when_no_media = true
rotate_album_art = true

[widget.network]
show_label = false

[widget.widget]
type = "piero-93/thinkpad-fan:widget"
